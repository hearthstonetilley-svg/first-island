name: build-eval

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck:server
      - run: npm run build
      - name: Build eval (every seed loads and draws an island)
        run: npm run eval
        env:
          EVAL_RUNS: 2
      - name: Sandbox eval (agents, councils, carry law, camera, pages)
        run: npm run eval:sandbox
      - name: Summary
        if: always()
        run: |
          cat eval-results/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          cat eval-results/sandbox/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval-results/
